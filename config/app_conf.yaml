################
# Application configuration file 
################

# Profile selects a profile overlay directory: config/profiles/<profile>/
# Override with BLUEPRINT_CONFIG env var.
profile: ${oc.env:BLUEPRINT_CONFIG,training_adn}

# Note : configuration leverage OmegaConf solvers. See :
# https://omegaconf.readthedocs.io/en/2.3_branch/usage.html#variable-interpolation

paths:
  data_root : ${oc.env:HOME}
  project : ${oc.env:PWD}
  src: ${paths.project}/genai_blueprint
  config: ${paths.project}/config
  demo_conf: ${paths.project}/config/demos
  models: ${oc.env:HOME}/.models
  postgres: postgresql://${oc.env:POSTGRES_USER,unknown_user}:${oc.env:POSTGRES_PASSWORD,password}@localhost:5432/ekg
  datasets : ${paths.project}/use_case_data
  # prefix 'genai_tk://' in navigation entries resolves to this package's webapp/pages dir

# Override environment variables
:env:
  LOGURU_LEVEL: INFO
  LANGCHAIN_TRACING_V2: "false" 

# Directories scanned recursively for YAML files at startup.
# config_dirs: [config/]

# Glob patterns to exclude from auto-scan (relative to each config_dir).
# config_exclude: []

# Load the provider registries and application defaults required by the active
# profile. Profile-specific values are applied below.
:merge:
  - "providers/**/*.yaml"
  - "profiles/baseline/**/*.yaml"

:profiles:
  training_adn:
    llm:
      models:
        default: gpt_oss120@openrouter
        azure: gpt_41@azure
        openai: gpt_41mini@openai
        for_vision: gpt_41@azure
        openrouter: gpt_oss120@openrouter
        local: gemma3_4b@ollama
    embeddings:
      models:
        default: ada_002@azure
        cheap: qwen3_06b@deepinfra
        edenai: ada_002@edenai
        local: artic_22@ollama
        azure: ada_002@azure
    vector_store:
      default: Chroma_in_memory


#### 
# User Interface Configuration : list of Streamlit pages, authentication, ... 
####    
ui:
  app_name : GenAI Lab and Practicum
  logo: genai_blueprint/webapp/static/New Atos logo white.png
  pages_dir : ${paths.src}/webapp/pages
  navigation:

    settings:
      - settings/welcome.py
      - settings/configuration.py
      - settings/MCP_servers.py

    training:
        - training/runnable_playground.py
        - training/CLI_runner.py
        - training/tokenization.py
        - training/embeddings.py

    demos:
      - demos/maintenance_agent.py
      - demos/mon_master.py
     # - demos/deep_search_agent.py
     # - demos/reAct_agent.py
      - demos/codeAct_agent.py
     # - demos/deep_agent.py
      - demos/graph_RAG.py
      - demos/anonymization.py
     # - demos/deer_flow_agent.py
      #- demos/cognee_KG.py

    agents:
      - genai_tk://demos/deer_flow_agent.py
      - genai_tk://demos/reAct_agent.py



#### 
# Authentication
####  
auth:
  enabled: ${oc.env:BASIC_AUTH_ENABLED,false}
  config_file: ${paths.config}/basic_auth.yaml

#####
# Command Line Interface configuration
####
cli:
  commands:  # List modules:functions to register CLI commands
    - genai_tk.cli.commands_core.CoreCommands
    - genai_tk.cli.commands_info.InfoCommands
    - genai_tk.cli.commands_test.TestCommands
    - genai_tk.workflow.commands.WorkflowCommands
    - genai_tk.workflow.prefect_commands.PrefectCommands
    - genai_tk.extra.commands_extra.ExtraCommands
    - genai_tk.agents.commands_agents.AgentCommands
    - genai_tk.agents.sandbox.cli_commands.SandboxCommands
    - genai_tk.extra.structured.commands_baml.BamlCommands
    - genai_tk.workflow.rag.commands_rag.RagCommands
    - genai_tk.mcp.cli_commands.McpCommands
    - genai_tk.cli.commands_skills.SkillsCommands
    - genai_tk.main.cli.register_commands
    - genai_tk.cli.commands_monitoring.MonitoringCommands
 
logging:
  format: "<cyan>{time:HH:mm:ss}</cyan>-<level>{level: <7}</level> | <magenta>{file.name}</magenta>:<green>{line} <italic>{function}</italic></green>- <level>{message}</level>"
  level: INFO
  backtrace : True  # Should be False in production  - see https://loguru.readthedocs.io/en/stable/overview.html#fully-descriptive-exceptions
  